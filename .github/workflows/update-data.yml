name: Update Community Data

on:
  schedule:
    # Run once per day at 4:50am UTC
    - cron: "50 4 * * *"
  workflow_dispatch:

concurrency:
  group: update-community-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    name: Pull and Update Community Data
    runs-on: ubuntu-latest
    if: ${{ vars.USER_AGENT != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Pull recent and unprocessed challenges
        env:
          USER_AGENT: ${{ vars.USER_AGENT }}
        run: |
          START_DATE=$(date --date="a week ago" "+%Y-%m-%d")
          echo "Reprocessing challenges since ${START_DATE}..."
          uv run pull-ldc --force --start-date="${START_DATE}"
          echo "Processing all remaining unprocessed challenges..."
          uv run pull-ldc

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add datasources/

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "Update community tournament data [${TIMESTAMP}] [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
